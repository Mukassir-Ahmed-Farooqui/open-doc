# Local stack: Postgres + pgvector, MinIO (S3-compatible) and the API.
#   docker compose up --build    ->  API docs on http://localhost:8000/docs
# Put GROQ_API_KEY (and optionally GEMINI_API_KEY) in a .env file next to this one.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opendoc
      POSTGRES_PASSWORD: opendoc
      POSTGRES_DB: opendoc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendoc -d opendoc"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opendoc
      MINIO_ROOT_PASSWORD: opendoc-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 opendoc opendoc-secret &&
                  mc mb --ignore-existing local/opendoc"

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://opendoc:opendoc@db:5432/opendoc
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-me-0123456789abcdef}
      STORAGE_BACKEND: s3
      S3_BUCKET: opendoc
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: opendoc
      S3_SECRET_ACCESS_KEY: opendoc-secret
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    mem_limit: 1g

volumes:
  pgdata:
  miniodata:
