line-length = 110
target-version = "py312"
src = ["backend", "."]
extend-exclude = ["backend/migrations/versions", "frontend"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003", "B008"]

[lint.isort]
known-first-party = ["app", "tests", "scripts"]

[lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S107", "S311", "RUF059"]
"scripts/**" = ["S603", "S105", "S106", "T20"]
