name: backend-ci

on:
  push:
    paths: ["backend/**", "scripts/eval/**", "tests/fixtures/**", "tests/evaluation/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "scripts/eval/**", "tests/fixtures/**", "tests/evaluation/**", ".github/workflows/backend-ci.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.17.3 check .
      - run: uvx ruff@0.17.3 format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      FASTEMBED_CACHE_DIR: /home/runner/.cache/fastembed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-minilm-l6-v1
      - run: uv venv && uv pip install -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
